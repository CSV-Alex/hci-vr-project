<div class="testing">
  @if (title()) {
    <h4 class="title">{{ title() }}</h4>
  }
  <ul class="photos" [class.photos--portrait]="orientation() === 'portrait'">
    @for (photo of photos(); track photo.src) {
      <li class="photo">
        <app-figure
          [src]="photo.src"
          [alt]="photo.alt"
          [caption]="photo.caption ?? ''"
          fit="cover"
        />
      </li>
    }
  </ul>
</div>
