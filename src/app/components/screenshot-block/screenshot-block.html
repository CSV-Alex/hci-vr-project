<div class="screenshots">
  @if (title()) {
    <h4 class="title">{{ title() }}</h4>
  }
  <ul class="shots" [class.shots--grid]="columns() === 2">
    @for (shot of shots(); track shot.src) {
      <li class="shot">
        <app-figure [src]="shot.src" [alt]="shot.alt" [caption]="shot.caption ?? ''" />
      </li>
    }
  </ul>
</div>
