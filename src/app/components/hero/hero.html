<header class="hero">
  <div class="inner">
    <p class="eyebrow">Portafolio de avance · HCI</p>
    <h1 class="title">{{ hero.title }}</h1>
    <p class="subtitle">{{ hero.subtitle }}</p>

    @if (hero.image; as image) {
      <div class="media">
        <app-figure [src]="image.src" [alt]="image.alt" [caption]="image.caption ?? ''" />
      </div>
    }
  </div>
</header>
