<div class="storyboard">
  @if (title()) {
    <h4 class="title">{{ title() }}</h4>
  }
  <ul class="panels" tabindex="0">
    @for (panel of panels(); track panel.src; let index = $index) {
      <li class="panel">
        <span class="panel-index">{{ index + 1 }}</span>
        <app-figure [src]="panel.src" [alt]="panel.alt" [caption]="panel.caption ?? ''" />
      </li>
    }
  </ul>
</div>
