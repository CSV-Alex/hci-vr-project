<div class="flow">
  @if (title()) {
    <h4 class="title">{{ title() }}</h4>
  }
  <ul class="diagrams">
    @for (diagram of diagrams(); track diagram.src) {
      <li class="diagram">
        <app-figure
          [src]="diagram.src"
          [alt]="diagram.alt"
          [caption]="diagram.caption ?? ''"
        />
      </li>
    }
  </ul>
</div>
